<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <script>
      // Global variables and functions for keyless Google Maps API
      var map;
      window.googleMapsLoaded = false;
      
      // This function will be called by the keyless API when ready
      function initMap() {
        console.log('Google Maps API loaded via keyless script');
        window.googleMapsLoaded = true;
        window.google = window.google || {};
        
        // Trigger any waiting callbacks
        if (window.initMapCallback) {
          console.log('Calling initMapCallback from global initMap');
          window.initMapCallback();
        }
      }
      
      // Debug script loading
      console.log('Global initMap function defined');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Keyless Google Maps API - must be at end of body -->
    <script 
      src="https://cdn.jsdelivr.net/gh/somanchiu/Keyless-Google-Maps-API@v7.1/mapsJavaScriptAPI.js" 
      async 
      defer
      onload="console.log('Keyless Google Maps script loaded successfully')"
      onerror="console.error('Failed to load keyless Google Maps script')"
    ></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
