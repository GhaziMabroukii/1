<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <script>
      // Mock Google Maps API for basic functionality without external dependencies
      window.google = {
        maps: {
          MapTypeId: { SATELLITE: 'satellite', ROADMAP: 'roadmap' },
          Map: function(element, options) {
            this.element = element;
            this.options = options;
            this.listeners = {};
            this.addListener = function(event, callback) {
              if (!this.listeners[event]) this.listeners[event] = [];
              this.listeners[event].push(callback);
            };
            this.setCenter = function(position) { this.center = position; };
            this.setZoom = function(zoom) { this.zoom = zoom; };
          },
          Marker: function(options) {
            this.position = options.position;
            this.map = options.map;
            this.draggable = options.draggable;
            this.title = options.title;
            this.listeners = {};
            this.setPosition = function(position) { this.position = position; };
            this.getPosition = function() { 
              return { 
                lat: () => this.position.lat, 
                lng: () => this.position.lng 
              }; 
            };
            this.addListener = function(event, callback) {
              if (!this.listeners[event]) this.listeners[event] = [];
              this.listeners[event].push(callback);
            };
          },
          Geocoder: function() {
            this.geocode = function(request, callback) {
              // Simple mock response for geocoding
              setTimeout(() => {
                callback([{
                  formatted_address: request.location ? 
                    `${request.location.lat.toFixed(4)}, ${request.location.lng.toFixed(4)}, Tunisia` :
                    'Tunisia'
                }], 'OK');
              }, 100);
            };
          }
        }
      };
      
      // Define initMap as a global function to prevent runtime errors
      function initMap() {
        console.log('Google Maps initialized with mock API');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
